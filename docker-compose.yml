services:
  postgres:
    image: postgres:16-alpine
    container_name: financial_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-financial_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-financial_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20
    container_name: financial_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    user: "1000:1000"
    # --webpack: Turbopack's file watcher doesn't reliably pick up changes through this
    # Windows bind mount even with watchOptions.pollIntervalMs set in next.config.ts;
    # webpack's watchpack-based polling is the proven path here.
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed && npm run dev -- --webpack"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-financial_db}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
